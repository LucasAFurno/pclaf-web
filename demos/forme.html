<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Forme · Demo PCLAF</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font: 16px Arial;
        color: #111;
      }
      nav,
      section,
      footer {
        max-width: 1160px;
        margin: auto;
        padding: 24px;
      }
      nav {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
      }
      a {
        color: inherit;
      }
      .hero {
        min-height: 560px;
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        align-items: end;
      }
      .hero h1 {
        font-size: clamp(58px, 10vw, 130px);
        letter-spacing: -0.1em;
        line-height: 0.78;
        margin: 0 0 35px;
      }
      .block {
        height: 78%;
        background: #4c64ff;
        margin: 0 0 0 30px;
      }
      .intro {
        background: #f2f2f2;
        max-width: none;
      }
      .intro div {
        max-width: 1110px;
        margin: auto;
        padding: 75px 24px;
      }
      .intro h2 {
        max-width: 620px;
        font-size: 45px;
        letter-spacing: -0.07em;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
      }
      .grid div {
        height: 180px;
        background: #ddd;
        padding: 18px;
        display: flex;
        align-items: end;
        font-weight: bold;
      }
      .grid div:nth-child(2) {
        background: #222;
        color: #fff;
      }
      .cta {
        text-align: center;
        padding: 90px 20px;
      }
      .cta a {
        display: inline-block;
        background: #111;
        color: #fff;
        text-decoration: none;
        padding: 14px 19px;
      }
      @media (max-width: 650px) {
        .hero {
          grid-template-columns: 1fr;
          min-height: 480px;
        }
        .block {
          height: 140px;
          margin: 0;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .intro h2 {
          font-size: 34px;
        }
      }
  .hero{background-image:linear-gradient(90deg,rgba(255,255,255,.95),rgba(255,255,255,.24)),url('../assets/demo-comercios.png');background-size:100% 100%,400% auto;background-position:center,0% 100%}.block{background:rgba(76,100,255,.84)}
  </style>
  </head>
  <body>
    <nav><b>FORME</b><span>OBRAS · ESTUDIO · CONTACTO</span></nav>
    <section class="hero">
      <h1>Menos,<br />pero mejor.</h1>
      <div class="block"></div>
    </section>
    <section class="intro">
      <div>
        <h2>Arquitectura que deja espacio para vivir.</h2>
        <div class="grid">
          <div>Casa N° 14</div>
          <div>Estudio Sur</div>
          <div>Patio Central</div>
        </div>
      </div>
    </section>
    <section class="cta">
      <h2>Hablemos de tu próximo espacio.</h2>
      <a href="https://wa.me/5491135708345?text=Hola%20PCLAF%2C%20quiero%20consultar%20por%20este%20modelo%20de%20web." target="_blank" rel="noopener">Consultar por este modelo</a>
    </section>
    <footer>Campana 51, Floresta, CABA · PCLAF</footer>
  </body>
</html>
