    :root{--a:#e56e42;--b:#f5e6d4;--ink:#20201d;--photo-position:0% 0%}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--ink);font-family:'DM Sans',Arial}nav,main,footer{max-width:1120px;margin:auto;padding:24px}nav{display:flex;justify-content:space-between;align-items:center;font:11px 'DM Mono';text-transform:uppercase;letter-spacing:.06em}nav a{color:inherit;text-decoration:none}.hero{min-height:510px;display:flex;align-items:center;position:relative;overflow:hidden}.hero-photo{position:absolute;inset:0;background-image:linear-gradient(90deg,var(--b) 5%,rgba(245,230,212,.88) 35%,rgba(245,230,212,.15) 72%),url('../assets/demo-comercios.png');background-repeat:no-repeat;background-size:100% 100%,400% auto;background-position:center,var(--photo-position);filter:saturate(.88)}.hero>div{position:relative;z-index:1;max-width:650px}.kicker{font:11px 'DM Mono';letter-spacing:.1em;color:var(--a);text-transform:uppercase}.hero h1{font:600 clamp(55px,8vw,98px)/.9 'Playfair Display';letter-spacing:-.06em;margin:18px 0}.hero p{max-width:410px;line-height:1.7}.button{display:inline-block;margin-top:16px;padding:13px 18px;background:var(--ink);color:#fff;text-decoration:none;font:11px 'DM Mono';letter-spacing:.06em}.band{background:var(--ink);color:#fff;padding:72px 24px}.band>div{max-width:1072px;margin:auto}.band h2{font-size:42px;letter-spacing:-.06em;margin:0 0 25px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}.card b{font:11px 'DM Mono';color:#ffd2bd}.card h3{margin:14px 0 7px;font-size:21px}.card p{margin:0;color:#ccc;font-size:14px;line-height:1.55}.visit{padding:75px 24px;text-align:center}.visit h2{font-size:42px;letter-spacing:-.06em;margin:0}.visit p{color:#645f5a;line-height:1.7}.visit a{color:inherit;font-weight:700}@media(max-width:650px){nav{padding:18px}.hero{min-height:455px}.hero-photo{background-image:linear-gradient(90deg,var(--b   </style>
</head>

  </script>
</body>
