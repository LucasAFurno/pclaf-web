<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCLAF — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --red:#CC0000;--red-dark:#a80000;--red-dim:rgba(204,0,0,0.12);
  --black:#0a0a0a;--black2:#111111;--black3:#1a1a1a;--black4:#222222;
  --border:#2e2e2e;--border2:#3a3a3a;
  --text:#f0f0f0;--text2:#999;--text3:#555;
  --green:#22c55e;--green-dim:rgba(34,197,94,0.1);
  --amber:#f59e0b;--amber-dim:rgba(245,158,11,0.1);
  --blue:#3b82f6;--blue-dim:rgba(59,130,246,0.1);
  --mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;
}
body{background:var(--black);color:var(--text);font-family:var(--sans);min-height:100vh;}

/* LOGIN */
#loginScreen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--black);
}
.login-box{
  background:var(--black2);border:1px solid var(--border);border-top:3px solid var(--red);
  border-radius:14px;padding:40px;width:100%;max-width:360px;
}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
.login-title{font-size:17px;font-weight:700;color:#fff;margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--text3);}
.login-label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.06em;}
.login-input{width:100%;background:var(--black3);border:1.5px solid var(--border2);border-radius:8px;padding:12px 16px;font-size:15px;color:var(--text);outline:none;font-family:var(--mono);transition:border-color .2s;margin-bottom:16px;}
.login-input:focus{border-color:var(--red);}
.login-btn{width:100%;background:var(--red);border:none;border-radius:8px;padding:13px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;transition:background .15s;}
.login-btn:hover{background:var(--red-dark);}
.login-error{font-size:13px;color:var(--red);margin-top:10px;display:none;text-align:center;}

/* LAYOUT */
#app{display:none;}
.topbar{background:var(--black2);border-bottom:2px solid var(--red);padding:0 24px;height:60px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;}
.logo-wordmark{font-size:18px;font-weight:800;color:#fff;}
.logo-wordmark em{color:var(--red);font-style:normal;}
.admin-badge{font-family:var(--mono);font-size:10px;background:var(--red-dim);color:var(--red);border:1px solid rgba(204,0,0,.3);border-radius:4px;padding:3px 8px;letter-spacing:.06em;}
.logout-btn{margin-left:auto;font-size:12px;color:var(--text3);background:none;border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer;transition:all .15s;}
.logout-btn:hover{color:var(--red);border-color:var(--red);}

main{max-width:1200px;margin:0 auto;padding:28px 24px 80px;}

/* STATS BAR */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px;}
.stat-card{background:var(--black2);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
.stat-card-num{font-family:var(--mono);font-size:28px;font-weight:700;color:#fff;margin-bottom:3px;}
.stat-card-label{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;}
.stat-card.red .stat-card-num{color:var(--red);}
.stat-card.amber .stat-card-num{color:var(--amber);}
.stat-card.green .stat-card-num{color:var(--green);}

/* FILTERS */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;align-items:center;}
.filter-btn{font-family:var(--mono);font-size:11px;font-weight:500;padding:6px 14px;border-radius:20px;cursor:pointer;transition:all .15s;border:1px solid var(--border);background:var(--black2);color:var(--text2);}
.filter-btn.active{background:var(--red);border-color:var(--red);color:#fff;}
.search-admin{flex:1;min-width:200px;background:var(--black2);border:1px solid var(--border2);border-radius:8px;padding:8px 14px;font-size:13px;color:var(--text);outline:none;font-family:var(--sans);}
.search-admin:focus{border-color:var(--red);}
.search-admin::placeholder{color:var(--text3);}
.add-btn{display:flex;align-items:center;gap:6px;background:var(--red);border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;transition:background .15s;white-space:nowrap;}
.add-btn:hover{background:var(--red-dark);}

/* REPAIR CARDS */
.repairs-list{display:flex;flex-direction:column;gap:10px;}
.repair-card{background:var(--black2);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .2s;}
.repair-card:hover{border-color:var(--border2);}
.repair-card.open{border-color:var(--red);}

.repair-card-head{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;}
.rep-num{font-family:var(--mono);font-size:12px;color:var(--text3);min-width:50px;flex-shrink:0;}
.rep-device{flex:1;min-width:0;}
.rep-device-name{font-size:14px;font-weight:600;color:#fff;margin-bottom:2px;}
.rep-device-client{font-size:12px;color:var(--text2);}
.rep-problem{font-size:13px;color:var(--text2);flex:2;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rep-chevron{color:var(--text3);transition:transform .25s;flex-shrink:0;}
.rep-chevron svg{width:15px;height:15px;display:block;}
.repair-card.open .rep-chevron{transform:rotate(180deg);}

/* Status badge */
.sbadge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;font-family:var(--mono);white-space:nowrap;}
.sbadge .dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.sb-espera{background:var(--black3);color:var(--text3);border:1px solid var(--border);}
.sb-espera .dot{background:var(--text3);}
.sb-proceso{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(245,158,11,.2);}
.sb-proceso .dot{background:var(--amber);animation:py 1.5s infinite;}
.sb-listo{background:var(--green-dim);color:var(--green);border:1px solid rgba(34,197,94,.2);}
.sb-listo .dot{background:var(--green);animation:pg 1.5s infinite;}
.sb-entregado{background:var(--black3);color:var(--text3);border:1px solid var(--border);}
.sb-entregado .dot{background:var(--text3);}
@keyframes pg{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.45)}50%{box-shadow:0 0 0 4px rgba(34,197,94,0)}}
@keyframes py{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.45)}50%{box-shadow:0 0 0 4px rgba(245,158,11,0)}}

/* REPAIR BODY */
.repair-card-body{display:none;padding:0 18px 20px;border-top:1px solid var(--border);}
.repair-card.open .repair-card-body{display:block;}

.body-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;}
.body-section{background:var(--black3);border:1px solid var(--border);border-radius:10px;padding:16px;}
.body-section h4{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;}

/* Client info */
.client-info-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.ci-label{font-size:12px;color:var(--text3);}
.ci-val{font-size:13px;font-weight:600;color:#fff;font-family:var(--mono);}
.wa-direct{display:inline-flex;align-items:center;gap:6px;background:#25d366;color:#fff;text-decoration:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;margin-top:8px;transition:opacity .15s;width:100%;justify-content:center;}
.wa-direct:hover{opacity:.88;}

/* Status changer */
.status-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.status-opt{padding:9px;border-radius:8px;border:1.5px solid var(--border);background:var(--black4);font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;text-align:center;font-family:var(--mono);}
.status-opt:hover{border-color:var(--border2);color:#fff;}
.status-opt.active-espera{border-color:var(--text3);color:var(--text3);background:rgba(255,255,255,.05);}
.status-opt.active-proceso{border-color:var(--amber);color:var(--amber);background:var(--amber-dim);}
.status-opt.active-listo{border-color:var(--green);color:var(--green);background:var(--green-dim);}
.status-opt.active-entregado{border-color:var(--blue);color:var(--blue);background:var(--blue-dim);}

/* Timeline steps */
.steps-list{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto;margin-bottom:10px;}
.step-row{display:flex;align-items:center;gap:8px;background:var(--black4);border-radius:6px;padding:8px 10px;}
.step-estado{font-size:10px;}
.step-titulo{font-size:12px;color:var(--text);flex:1;}
.step-fecha{font-family:var(--mono);font-size:10px;color:var(--text3);}
.step-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;transition:color .15s;padding:0 4px;}
.step-del:hover{color:var(--red);}

/* Add step form */
.add-step-form{display:flex;flex-direction:column;gap:8px;}
.form-row{display:flex;gap:8px;}
.form-input{flex:1;background:var(--black4);border:1px solid var(--border2);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--text);outline:none;font-family:var(--sans);}
.form-input:focus{border-color:var(--red);}
.form-select{background:var(--black4);border:1px solid var(--border2);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--text);outline:none;cursor:pointer;}
.form-select:focus{border-color:var(--red);}
.form-btn{background:var(--red);border:none;border-radius:6px;padding:8px 14px;font-size:12px;font-weight:700;color:#fff;cursor:pointer;white-space:nowrap;transition:background .15s;}
.form-btn:hover{background:var(--red-dark);}
.form-btn.secondary{background:var(--black4);border:1px solid var(--border2);color:var(--text2);}
.form-btn.secondary:hover{border-color:var(--border);color:var(--text);}

/* Presupuesto */
.presup-row{display:flex;gap:8px;align-items:center;}
.presup-input{flex:1;background:var(--black4);border:1px solid var(--border2);border-radius:6px;padding:8px 10px;font-size:13px;color:var(--text);outline:none;font-family:var(--mono);}
.presup-input:focus{border-color:var(--red);}

/* Loading/empty states */
.loading-state{text-align:center;padding:60px;color:var(--text3);}
.spinner{width:28px;height:28px;border:2.5px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:60px;color:var(--text3);font-size:14px;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--black2);border:1px solid var(--border2);border-radius:14px;padding:28px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
.modal h3{font-size:17px;font-weight:700;color:#fff;margin-bottom:20px;}
.modal-grid{display:flex;flex-direction:column;gap:12px;}
.modal-label{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;display:block;}
.modal-input{width:100%;background:var(--black3);border:1.5px solid var(--border2);border-radius:8px;padding:11px 14px;font-size:14px;color:var(--text);outline:none;font-family:var(--sans);}
.modal-input:focus{border-color:var(--red);}
.modal-select{width:100%;background:var(--black3);border:1.5px solid var(--border2);border-radius:8px;padding:11px 14px;font-size:14px;color:var(--text);outline:none;cursor:pointer;}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--black2);border:1px solid var(--border2);border-left:3px solid var(--green);border-radius:10px;padding:12px 18px;font-size:13px;font-weight:600;color:#fff;z-index:300;transform:translateY(80px);opacity:0;transition:all .3s;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.error{border-left-color:var(--red);}

@media(max-width:768px){
  .stats-bar{grid-template-columns:1fr 1fr;}
  .body-grid{grid-template-columns:1fr;}
  .rep-problem{display:none;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <svg width="40" height="40" viewBox="0 0 42 42" style="border-radius:6px;overflow:hidden;flex-shrink:0">
        <rect x="0" y="0" width="42" height="22" fill="#CC0000"/>
        <rect x="0" y="22" width="42" height="20" fill="#111"/>
        <text x="21" y="19" text-anchor="middle" font-family="Arial Black,sans-serif" font-weight="900" font-size="18" fill="white">PC</text>
        <text x="21" y="38" text-anchor="middle" font-family="Arial Black,sans-serif" font-weight="900" font-size="14" fill="white">LAF</text>
      </svg>
      <div>
        <div style="font-size:18px;font-weight:800;color:#fff;">PC<span style="color:#CC0000">LAF</span></div>
        <div style="font-size:11px;color:#555;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;">Panel admin</div>
      </div>
    </div>
    <label class="login-label">Contraseña</label>
    <input class="login-input" type="password" id="loginPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-error" id="loginError">Contraseña incorrecta</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <svg width="36" height="36" viewBox="0 0 42 42" style="border-radius:5px;overflow:hidden;flex-shrink:0">
      <rect x="0" y="0" width="42" height="22" fill="#CC0000"/>
      <rect x="0" y="22" width="42" height="20" fill="#111"/>
      <text x="21" y="19" text-anchor="middle" font-family="Arial Black,sans-serif" font-weight="900" font-size="18" fill="white">PC</text>
      <text x="21" y="38" text-anchor="middle" font-family="Arial Black,sans-serif" font-weight="900" font-size="14" fill="white">LAF</text>
    </svg>
    <div class="logo-wordmark">PC<em>LAF</em></div>
    <div class="admin-badge">ADMIN</div>
    <a href="index.html" style="font-size:12px;color:var(--text3);text-decoration:none;margin-left:8px;">← Web principal</a>
    <button class="logout-btn" onclick="logout()">Cerrar sesión</button>
  </div>

  <main>
    <!-- Stats -->
    <div class="stats-bar" id="statsBar">
      <div class="stat-card"><div class="stat-card-num" id="statTotal">–</div><div class="stat-card-label">Total reparaciones</div></div>
      <div class="stat-card amber"><div class="stat-card-num" id="statProceso">–</div><div class="stat-card-label">En proceso</div></div>
      <div class="stat-card green"><div class="stat-card-num" id="statListo">–</div><div class="stat-card-label">Listos para retirar</div></div>
      <div class="stat-card red"><div class="stat-card-num" id="statEspera">–</div><div class="stat-card-label">En espera</div></div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('todos',this)">Todos</button>
      <button class="filter-btn" onclick="setFilter('espera',this)">En espera</button>
      <button class="filter-btn" onclick="setFilter('proceso',this)">En proceso</button>
      <button class="filter-btn" onclick="setFilter('listo',this)">Listos</button>
      <button class="filter-btn" onclick="setFilter('entregado',this)">Entregados</button>
      <input class="search-admin" id="searchAdmin" placeholder="Buscar por cliente, equipo o #número..." oninput="renderList()"/>
      <button class="add-btn" onclick="openModal()">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M8 2v12M2 8h12"/></svg>
        Nueva reparación
      </button>
    </div>

    <!-- List -->
    <div id="repairsList" class="repairs-list">
      <div class="loading-state"><div class="spinner"></div><p>Cargando...</p></div>
    </div>
  </main>
</div>

<!-- MODAL nueva reparación -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>Nueva reparación</h3>
    <div class="modal-grid">
      <div>
        <label class="modal-label">Código de cliente</label>
        <input class="modal-input" id="mCodigo" placeholder="Ej: LUCAS01" oninput="this.value=this.value.toUpperCase()"/>
      </div>
      <div>
        <label class="modal-label">Nombre del cliente</label>
        <input class="modal-input" id="mNombre" placeholder="Ej: Lucas Méndez"/>
      </div>
      <div>
        <label class="modal-label">Teléfono</label>
        <input class="modal-input" id="mTelefono" placeholder="Ej: 11 5823-9201"/>
      </div>
      <div>
        <label class="modal-label">Equipo</label>
        <input class="modal-input" id="mEquipo" placeholder="Ej: Notebook HP"/>
      </div>
      <div>
        <label class="modal-label">Modelo</label>
        <input class="modal-input" id="mModelo" placeholder="Ej: Pavilion 15-eh1"/>
      </div>
      <div>
        <label class="modal-label">Número de reparación</label>
        <input class="modal-input" id="mNumero" placeholder="Ej: 0043" style="font-family:var(--mono)"/>
      </div>
      <div>
        <label class="modal-label">Problema</label>
        <input class="modal-input" id="mProblema" placeholder="Ej: No enciende, falla en pantalla..."/>
      </div>
      <div>
        <label class="modal-label">Presupuesto</label>
        <input class="modal-input" id="mPresupuesto" placeholder="Ej: $85.000" style="font-family:var(--mono)"/>
      </div>
      <div>
        <label class="modal-label">Ícono del equipo</label>
        <select class="modal-select" id="mIcono">
          <option value="💻">💻 Notebook</option>
          <option value="🖥️">🖥️ PC escritorio</option>
          <option value="🖨️">🖨️ Impresora</option>
          <option value="📱">📱 Celular</option>
          <option value="🎮">🎮 Consola</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="form-btn secondary" onclick="closeModal()">Cancelar</button>
      <button class="form-btn" onclick="crearReparacion()">Crear reparación</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  CONFIG
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const SUPABASE_URL      = 'https://bcmfzgjpqfjnudhgraan.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_I1oJLpCSeneeIw2SghABAw_GXrdLLWs';
const ADMIN_PASSWORD    = 'pclaf2026';  // ← cambiá esto por tu contraseña

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  DB helper
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const H = { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json', Prefer: 'return=representation' };

async function db(method, table, qs='', body=null) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}${qs}`, {
    method, headers: H, body: body ? JSON.stringify(body) : null
  });
  if (!r.ok) { const e = await r.text(); throw new Error(e); }
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  LOGIN
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function doLogin() {
  const pass = document.getElementById('loginPass').value;
  if (pass === ADMIN_PASSWORD) {
    sessionStorage.setItem('pclaf_admin', '1');
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadAll();
  } else {
    document.getElementById('loginError').style.display = 'block';
    document.getElementById('loginPass').value = '';
  }
}
function logout() { sessionStorage.removeItem('pclaf_admin'); location.reload(); }
if (sessionStorage.getItem('pclaf_admin')) {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  DATA
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let allData = [];   // [{rep, equipo, cliente}]
let filter = 'todos';

async function loadAll() {
  try {
    const [reps, equipos, clientes] = await Promise.all([
      db('GET','reparaciones','?order=created_at.desc'),
      db('GET','equipos',''),
      db('GET','clientes',''),
    ]);
    allData = reps.map(r => ({
      rep: r,
      equipo: equipos.find(e => e.id === r.equipo_id) || {},
      cliente: clientes.find(c => {
        const eq = equipos.find(e => e.id === r.equipo_id);
        return eq && c.id === eq.cliente_id;
      }) || {}
    }));
    updateStats();
    renderList();
  } catch(e) {
    document.getElementById('repairsList').innerHTML = `<div class="empty-state">Error cargando datos. Revisá la conexión.</div>`;
  }
}

function updateStats() {
  document.getElementById('statTotal').textContent   = allData.length;
  document.getElementById('statProceso').textContent = allData.filter(d=>d.rep.estado==='proceso').length;
  document.getElementById('statListo').textContent   = allData.filter(d=>d.rep.estado==='listo').length;
  document.getElementById('statEspera').textContent  = allData.filter(d=>d.rep.estado==='espera').length;
}

function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function renderList() {
  const q = document.getElementById('searchAdmin').value.toLowerCase();
  let data = allData;
  if (filter !== 'todos') data = data.filter(d => d.rep.estado === filter);
  if (q) data = data.filter(d =>
    d.cliente.nombre?.toLowerCase().includes(q) ||
    d.equipo.nombre?.toLowerCase().includes(q) ||
    d.rep.numero?.includes(q) ||
    d.rep.problema?.toLowerCase().includes(q)
  );

  if (!data.length) {
    document.getElementById('repairsList').innerHTML = `<div class="empty-state">No hay reparaciones${filter!=='todos'?' en este estado':''}.</div>`;
    return;
  }

  document.getElementById('repairsList').innerHTML = data.map(d => repCard(d)).join('');
}

const ESTADO_LABELS = { espera:'En espera', proceso:'En reparación', listo:'Listo para retirar', entregado:'Entregado' };
const ESTADO_ICONS  = { espera:'⏳', proceso:'🔧', listo:'✅', entregado:'📦' };

      <div class="rep-device">

          <div class="client-info-row"><span class="ci-label">Teléfono</span><span class="ci-val">${cliente.telefono||'–'}</span></div>
          <div class="client-info-row"><span class="ci-label">Código</span><span class="ci-val">${cliente.codigo||'–'}</span></div>
          <div class="client-info-row"><span class="ci-label">Equipo</span><span class="ci-val">${equipo.nombre||'–'} ${equipo.modelo?'· '+equipo.modelo:''}</span></div>
          <div class="client-info-row"><span class="ci-label">Presupuesto</span>
            <div style="display:flex;gap:6px;align-items:center">
              <input class="presup-input" id="presup-${rep.id}" value="${rep.presupuesto||''}" placeholder="$0.000" style="width:110px"/>
              <button class="form-btn" style="padding:6px 10px;font-size:11px" onclick="savePresup('${rep.id}')">Guardar</button>

              <input class="form-input" id="stepTitulo-${rep.id}" placeholder="Título del paso (ej: Diagnóstico completado)"/>

              </select>
            </div>

              <input class="form-input" id="stepNota-${rep.id}" placeholder="Nota / comentario (opcional)"/>
              <input class="form-input" id="stepFecha-${rep.id}" placeholder="Fecha (ej: 20 mar)" style="max-width:140px"/>

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  ACCIONES
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function toggleCard(repId) {
  const card = document.getElementById(`card-${repId}`);
  const body = document.getElementById(`body-${repId}`);
  const isOpen = card.classList.contains('open');
  // close all
  document.querySelectorAll('.repair-card.open').forEach(c=>c.classList.remove('open'));
  if (!isOpen) {
    card.classList.add('open');
    await loadPasos(repId);
  }
}

async function loadPasos(repId) {
  const container = document.getElementById(`steps-${repId}`);
  try {
    const pasos = await db('GET','pasos',`?reparacion_id=eq.${repId}&order=orden.asc`);
    if (!pasos.length) {
      container.innerHTML = `<div style="color:var(--text3);font-size:12px;text-align:center;padding:12px">Sin pasos todavía</div>`;
      return;
    }
    const estados = { done:'✅', active:'🔧', pending:'⏳' };
    container.innerHTML = pasos.map(p=>`
      <div class="step-row">
        <span class="step-estado">${estados[p.estado]||'•'}</span>
        <span class="step-titulo">${p.titulo}${p.nota?` — <span style="color:var(--text3)">${p.nota}</span>`:''}</span>
        <span class="step-fecha">${p.fecha||''}</span>
        <button class="step-del" onclick="borrarPaso('${p.id}','${repId}')" title="Borrar paso">✕</button>
      </div>`).join('');
  } catch(e) {
    container.innerHTML = `<div style="color:var(--red);font-size:12px">Error cargando pasos</div>`;
  }
}

async function agregarPaso(repId) {
  const titulo = document.getElementById(`stepTitulo-${repId}`).value.trim();
  if (!titulo) { toast('Escribí un título para el paso', true); return; }
  const estado = document.getElementById(`stepEstado-${repId}`).value;
  const nota   = document.getElementById(`stepNota-${repId}`).value.trim();
  const fecha  = document.getElementById(`stepFecha-${repId}`).value.trim();

  // Get max orden
  const existentes = await db('GET','pasos',`?reparacion_id=eq.${repId}&select=orden&order=orden.desc&limit=1`);
  const orden = existentes?.length ? existentes[0].orden + 1 : 1;

  await db('POST','pasos','',{ reparacion_id:repId, orden, titulo, estado, nota:nota||null, fecha:fecha||null, icono: estado==='done'?'check':estado==='active'?'wrench':'bell' });

  document.getElementById(`stepTitulo-${repId}`).value = '';
  document.getElementById(`stepNota-${repId}`).value   = '';
  document.getElementById(`stepFecha-${repId}`).value  = '';
  await loadPasos(repId);
  toast('Paso agregado ✓');
}

async function borrarPaso(pasoId, repId) {
  if (!confirm('¿Borrar este paso?')) return;
  await db('DELETE','pasos',`?id=eq.${pasoId}`);
  await loadPasos(repId);
  toast('Paso borrado');
}

async function cambiarEstado(repId, nuevoEstado, btn) {
  await db('PATCH','reparaciones',`?id=eq.${repId}`,{ estado: nuevoEstado });
  // Update local data
  const d = allData.find(x=>x.rep.id===repId);
  if (d) d.rep.estado = nuevoEstado;
  updateStats();
  // Update UI badges
  btn.closest('.status-btns').querySelectorAll('.status-opt').forEach(b=>{
    b.className = 'status-opt';
  });
  btn.classList.add('active-'+nuevoEstado);
  const badge = document.querySelector(`#card-${repId} .sbadge`);
  if (badge) {
    badge.className = `sbadge sb-${nuevoEstado}`;
    badge.innerHTML = `<span class="dot"></span>${ESTADO_LABELS[nuevoEstado]}`;
  }
  toast(`Estado cambiado a "${ESTADO_LABELS[nuevoEstado]}" ✓`);
}

async function savePresup(repId) {
  const val = document.getElementById(`presup-${repId}`).value.trim();
  await db('PATCH','reparaciones',`?id=eq.${repId}`,{ presupuesto: val });
  const d = allData.find(x=>x.rep.id===repId);
  if (d) d.rep.presupuesto = val;
  toast('Presupuesto guardado ✓');
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  MODAL — Nueva reparación
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function openModal()  { document.getElementById('modal').classList.add('open'); }
function closeModal() { document.getElementById('modal').classList.remove('open'); }

async function crearReparacion() {
  const codigo     = document.getElementById('mCodigo').value.trim().toUpperCase();
  const nombre     = document.getElementById('mNombre').value.trim();
  const telefono   = document.getElementById('mTelefono').value.trim();
  const equipo     = document.getElementById('mEquipo').value.trim();
  const modelo     = document.getElementById('mModelo').value.trim();
  const numero     = document.getElementById('mNumero').value.trim();
  const problema   = document.getElementById('mProblema').value.trim();
  const presupuesto= document.getElementById('mPresupuesto').value.trim();
  const icono      = document.getElementById('mIcono').value;

  if (!codigo||!nombre||!equipo||!numero||!problema) { toast('Completá los campos obligatorios', true); return; }

  try {
    // 1. Crear o encontrar cliente
    let clientes = await db('GET','clientes',`?codigo=eq.${codigo}`);
    let clienteId;
    if (clientes?.length) {
      clienteId = clientes[0].id;
    } else {
      const nuevo = await db('POST','clientes','',{ codigo, nombre, telefono });
      clienteId = nuevo[0].id;
    }

    // 2. Crear equipo
    const equipoRes = await db('POST','equipos','',{ cliente_id: clienteId, nombre: equipo, modelo, icono });
    const equipoId = equipoRes[0].id;

    // 3. Crear reparación
    await db('POST','reparaciones','',{ equipo_id: equipoId, numero, problema, presupuesto, estado: 'espera' });

    toast('Reparación creada ✓');
    closeModal();
    // Clear form
    ['mCodigo','mNombre','mTelefono','mEquipo','mModelo','mNumero','mProblema','mPresupuesto'].forEach(id=>{
      document.getElementById(id).value='';
    });
    await loadAll();
  } catch(e) {
    toast('Error: ' + (e.message||'revisá los datos'), true);
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  TOAST
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let toastTimer;
function toast(msg, error=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (error?' error':'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.className='toast', 3000);
}

// Init
if (sessionStorage.getItem('pclaf_admin')) loadAll();
document.getElementById('loginPass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
</script>
